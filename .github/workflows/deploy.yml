name: CI

# Deployment is NOT done here. The Cloudflare Pages project is connected
# directly to this GitHub repository (Cloudflare dashboard → Workers & Pages →
# the project → Settings → Builds & deployments), so Cloudflare pulls the code
# and builds/deploys it itself on every push to main.
#
# This workflow used to carry a second job that deployed via wrangler, gated on
# a CLOUDFLARE_API_TOKEN secret. That secret was never configured, so the deploy
# step silently skipped on every run while the workflow still reported success —
# nothing was ever published, and the green check made it look like it had been.
# With Cloudflare owning the deploy, that job is gone rather than left to rot.
#
# What remains is a pure gate: type-check and build must pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
